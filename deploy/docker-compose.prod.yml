services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: twintube_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "8080"
      APP_DOMAIN: twintube.site
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - twintube_net

  postgres:
    image: postgres:16-alpine
    container_name: twintube_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twintube_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-twintube_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twintube_user} -d ${POSTGRES_DB:-twintube_db}"]
      interval: 5s
      timeout: 5s
      retries: 8
    networks:
      - twintube_net

  # Optional: enable for push-to-talk voice. Open UDP/TCP 3478 and UDP 49152-49200.
  coturn:
    image: coturn/coturn:4.6.2
    container_name: twintube_coturn
    restart: unless-stopped
    network_mode: host
    environment:
      DETECT_EXTERNAL_IP: "yes"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--realm=${TURN_REALM:-twintube}"
      - "--no-multicast-peers"
      - "--no-cli"
      - "--min-port=49152"
      - "--max-port=49200"
    profiles:
      - voice

networks:
  twintube_net:
    driver: bridge

volumes:
  postgres_data:
