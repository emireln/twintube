# TwinTube — nginx reverse proxy (VPS with existing nginx on 80/443)
# Install: cp deploy/nginx/twintube.conf /etc/nginx/sites-enabled/twintube.conf && nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name twintube.site www.twintube.site home.twintube.site app.twintube.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.twintube.site;
    ssl_certificate /etc/letsencrypt/live/app.twintube.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.twintube.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://twintube.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name twintube.site www.twintube.site;
    ssl_certificate /etc/letsencrypt/live/app.twintube.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.twintube.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name home.twintube.site;
    ssl_certificate /etc/letsencrypt/live/app.twintube.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.twintube.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://twintube.site$request_uri;
}
