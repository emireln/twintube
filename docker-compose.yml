version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twintube_app
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DB_TYPE: postgres
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENV: ${ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: twintube_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twintube_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-twintube_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twintube_user} -d ${POSTGRES_DB:-twintube_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
