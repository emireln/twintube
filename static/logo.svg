<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Blue to Red Gradient -->
    <linearGradient id="twinPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="55%" stop-color="#4285f4" />
      <stop offset="100%" stop-color="#d93025" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="twinSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea4335" />
      <stop offset="100%" stop-color="#fbbc04" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="materialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#materialShadow)">
    <!-- Back Screen (Rotated Twin) -->
    <rect x="142" y="92" width="310" height="210" rx="36" fill="url(#twinSecondary)" opacity="0.9" transform="rotate(7 297 197)" />

    <!-- Front Primary Screen -->
    <rect x="60" y="160" width="330" height="220" rx="38" fill="url(#twinPrimary)" />

    <!-- Inner Screen Border -->
    <rect x="74" y="174" width="302" height="192" rx="26" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.22" />

    <!-- Centered Twin Play Triangle -->
    <path d="M 212 232 L 272 270 L 212 308 Z" fill="#ffffff" />

    <!-- Top-Right Sync Arc -->
    <path d="M 225 198 A 72 72 0 0 1 326 270" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <path d="M 326 278 L 340 254 L 312 254 Z" fill="#ffffff" />

    <!-- Bottom-Left Sync Arc -->
    <path d="M 225 342 A 72 72 0 0 1 124 270" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <path d="M 124 262 L 110 286 L 138 286 Z" fill="#ffffff" />
  </g>
</svg>
