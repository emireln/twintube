<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwinTube - Watch YouTube Videos Together</title>
  <meta name="description" content="A simple, real-time synchronized platform where you can watch YouTube videos together with friends.">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body class="landing-body">

  <!-- Top Navigation Header -->
  <header class="navbar">
    <a href="/" class="brand">
      <img src="/static/logo.svg" alt="TwinTube Logo" class="brand-icon-img">
      <span>Twin<span class="accent">Tube</span></span>
    </a>

    <div class="nav-actions">
      <!-- Buy Me A Coffee Button -->
      <a href="https://buymeacoffee.com/emireln" target="_blank" rel="noopener" class="bmc-btn" title="Buy me a coffee">
        <span>☕ Buy me a coffee</span>
      </a>

      <!-- Theme Toggle -->
      <button class="btn-icon" id="btnThemeToggle" title="Toggle Light/Dark Theme">🌙</button>

      <!-- Auth Action Buttons -->
      <div id="authNavContainer">
        <button class="btn btn-secondary" id="btnOpenAuthLogin">Log In</button>
        <button class="btn btn-primary" id="btnOpenAuthRegister">Sign Up</button>
        <div class="user-profile-menu" id="userProfileMenu" style="display: none;">
          <button class="user-avatar-btn" id="btnUserMenu">
            <span id="userAvatarText">U</span>
          </button>
          <div class="dropdown-menu" id="profileDropdown">
            <div class="dropdown-header">
              <strong id="dropdownUsername">Username</strong>
              <small id="dropdownEmail">user@example.com</small>
            </div>
            <hr>
            <button class="dropdown-item" id="btnLogout">Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Landing Hero Section -->
  <main class="landing-container">
    
    <!-- SyncTube Style Mockup Graphic -->
    <div class="hero-mockup-card">
      <div class="mockup-screen">
        <div class="mockup-play-icon">▶</div>
      </div>
      <div class="mockup-sidebar">
        <div class="mockup-line long"></div>
        <div class="mockup-line short"></div>
        <div class="mockup-line short"></div>
      </div>
    </div>

    <!-- Minimal Headline Text -->
    <h1 class="landing-title">
      A simple platform where you can watch<br>YouTube videos together.
    </h1>

    <!-- Large Prominent Create Room Button -->
    <button class="btn-create-room-large" id="btnLandingCreateRoom">
      Create Room
    </button>

    <!-- Buy Me A Coffee Banner Link -->
    <div class="landing-bmc-container">
      <a href="https://buymeacoffee.com/emireln" target="_blank" rel="noopener" class="bmc-landing-link">
        ☕ Enjoying TwinTube? Support the creator on Buy Me a Coffee
      </a>
    </div>

  </main>

  <!-- Auth Modal (Login / Register) -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <nav class="tab-header" style="border-radius: var(--radius-sm); margin-bottom: 16px;">
        <button class="tab-btn active" id="btnTabLogin">Sign In</button>
        <button class="tab-btn" id="btnTabRegister">Create Account</button>
      </nav>

      <!-- Login Form -->
      <form id="formLogin" class="modal-body">
        <div>
          <label style="font-size: 12px; font-weight: 500;">Username or Email</label>
          <input type="text" id="loginUser" class="input-field" style="width: 100%; margin-top: 4px;" required>
        </div>
        <div>
          <label style="font-size: 12px; font-weight: 500;">Password</label>
          <input type="password" id="loginPass" class="input-field" style="width: 100%; margin-top: 4px;" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="formRegister" class="modal-body" style="display: none;">
        <div>
          <label style="font-size: 12px; font-weight: 500;">Username</label>
          <input type="text" id="regUser" class="input-field" style="width: 100%; margin-top: 4px;" required minlength="3">
        </div>
        <div>
          <label style="font-size: 12px; font-weight: 500;">Email</label>
          <input type="email" id="regEmail" class="input-field" style="width: 100%; margin-top: 4px;" required>
        </div>
        <div>
          <label style="font-size: 12px; font-weight: 500;">Password</label>
          <input type="password" id="regPass" class="input-field" style="width: 100%; margin-top: 4px;" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Create Account</button>
      </form>

      <div class="modal-footer" style="justify-content: center;">
        <button class="btn btn-secondary" id="btnCloseAuth">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Landing Script -->
  <script type="module" src="/static/js/landing.js"></script>
</body>
</html>
