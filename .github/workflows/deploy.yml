name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  bump-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump VERSION patch
        id: bump
        run: |
          chmod +x scripts/bump-version.sh
          NEW=$(./scripts/bump-version.sh)
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped to v$NEW"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          git push

  # Web app deploy must not depend on desktop artifact storage (quota was blocking VPS updates).
  deploy:
    needs: bump-version
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync VERSION after bump commit
        run: git pull origin main

      - name: Record expected commit
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p downloads
            chmod +x scripts/deploy-vps.sh
            export VPS_APP_DIR="${{ secrets.VPS_APP_DIR }}"
            ./scripts/deploy-vps.sh

      - name: Verify live deployment
        run: |
          EXPECTED="${{ steps.meta.outputs.commit }}"
          VERSION="${{ steps.meta.outputs.version }}"
          echo "Waiting for containers to come up..."
          sleep 8
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sf "https://twintube.site/api/version" || true)
            if [ -n "$BODY" ]; then
              DEPLOYED=$(echo "$BODY" | jq -r '.commit // empty')
              LIVE_VERSION=$(echo "$BODY" | jq -r '.version // empty')
              echo "Attempt $attempt: live commit=$DEPLOYED version=$LIVE_VERSION (expected commit=$EXPECTED version=$VERSION)"
              if [ "$DEPLOYED" = "$EXPECTED" ]; then
                echo "API deployment verified."
                exit 0
              fi
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Live site did not report commit $EXPECTED after deploy."
              curl -s "https://twintube.site/api/version" || true
              exit 1
            fi
            sleep 6
          done

      - name: Deployment summary
        run: |
          echo "Deployed TwinTube v$(cat VERSION) (${{ steps.meta.outputs.commit }}) to https://twintube.site"

  build-desktop:
    needs: bump-version
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync VERSION after bump commit
        shell: bash
        run: git pull origin main

      - name: Sync desktop package version
        shell: bash
        run: |
          chmod +x scripts/sync-desktop-version.sh
          ./scripts/sync-desktop-version.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows NSIS installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never

      - name: Prepare download artifacts
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p desktop-artifacts
          SETUP=$(ls desktop/dist/TwinTube-Setup-*.exe | head -n 1)
          test -n "$SETUP"
          cp "$SETUP" "desktop-artifacts/TwinTube-Setup-${VERSION}.exe"
          cp "$SETUP" desktop-artifacts/TwinTube-Setup.exe
          if [ -f "${SETUP}.blockmap" ]; then
            cp "${SETUP}.blockmap" "desktop-artifacts/TwinTube-Setup-${VERSION}.exe.blockmap"
          fi
          if [ -f desktop/dist/latest.yml ]; then
            cp desktop/dist/latest.yml desktop-artifacts/latest.yml
          else
            echo "::error::latest.yml missing from electron-builder output"
            ls -la desktop/dist || true
            exit 1
          fi
          # Keep latest.yml pointing at the versioned installer name.
          python - <<'PY'
          from pathlib import Path
          import re
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          yml = Path('desktop-artifacts/latest.yml')
          text = yml.read_text(encoding='utf-8')
          text = re.sub(r'(?m)^path:\s*.*$', f'path: TwinTube-Setup-{version}.exe', text)
          text = re.sub(
              r'(?m)^(\s*-\s*url:\s*).*$',
              rf'\1TwinTube-Setup-{version}.exe',
              text,
              count=1,
          )
          yml.write_text(text, encoding='utf-8')
          print(yml.read_text(encoding='utf-8'))
          PY
          ls -lah desktop-artifacts

      # Upload straight to the VPS via native OpenSSH — container actions
      # (appleboy/scp-action) only run on Linux, and GitHub artifact storage is quota-limited.
      - name: Publish installer to VPS downloads
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -e
          KEY_FILE="$RUNNER_TEMP/vps_key"
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SSH_OPTS="-i $KEY_FILE -p ${VPS_SSH_PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR/downloads'"
          scp -i "$KEY_FILE" -P "${VPS_SSH_PORT:-22}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            desktop-artifacts/* "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/downloads/"
          rm -f "$KEY_FILE"

      - name: Verify desktop downloads
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for path in \
            "/downloads/TwinTube-Setup.exe" \
            "/downloads/TwinTube-Setup-${VERSION}.exe" \
            "/downloads/latest.yml"
          do
            CODE=$(curl -sI -o /dev/null -w "%{http_code}" "https://twintube.site${path}" || true)
            echo "$path -> HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::Expected HTTP 200 for $path"
              exit 1
            fi
          done
          echo "Desktop downloads verified."
