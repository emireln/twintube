name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  bump-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump VERSION patch
        id: bump
        run: |
          chmod +x scripts/bump-version.sh
          NEW=$(./scripts/bump-version.sh)
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped to v$NEW"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          git push

  deploy:
    needs: bump-version
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync VERSION after bump commit
        run: git pull origin main

      - name: Record expected commit
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy-vps.sh
            export VPS_APP_DIR="${{ secrets.VPS_APP_DIR }}"
            ./scripts/deploy-vps.sh

      - name: Verify live deployment
        run: |
          EXPECTED="${{ steps.meta.outputs.commit }}"
          VERSION="${{ steps.meta.outputs.version }}"
          echo "Waiting for containers to come up..."
          sleep 8
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -sf "https://twintube.site/api/version" || true)
            if [ -n "$BODY" ]; then
              DEPLOYED=$(echo "$BODY" | jq -r '.commit // empty')
              LIVE_VERSION=$(echo "$BODY" | jq -r '.version // empty')
              echo "Attempt $attempt: live commit=$DEPLOYED version=$LIVE_VERSION (expected commit=$EXPECTED version=$VERSION)"
              if [ "$DEPLOYED" = "$EXPECTED" ]; then
                echo "Deployment verified successfully."
                exit 0
              fi
            fi
            sleep 6
          done
          echo "::error::Live site did not report commit $EXPECTED after deploy."
          curl -s "https://twintube.site/api/version" || true
          exit 1

      - name: Deployment summary
        run: |
          echo "Deployed TwinTube v$(cat VERSION) (${{ steps.meta.outputs.commit }}) to https://twintube.site"
          echo "Home landing: https://home.twintube.site"
